name: deploy resources

env:
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GH_PAT }}
on:
  workflow_dispatch:

  push:
    branches:
      - main
permissions:
  contents: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_USE_CLI: "true"

    defaults:
      run:
        working-directory: ./infrastructure/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - name: Verify Terraform
        run: terraform version

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Login
        run: |
          az account show --output table

      - name: Verify Azure CLI
        run: |
          az --version

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_client_id: ${{ secrets.ARM_CLIENT_ID }}
          TF_VAR_client_secret: ${{ secrets.ARM_CLIENT_SECRET }}
          TF_VAR_tenant_id: ${{ secrets.ARM_TENANT_ID }}
          TF_VAR_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run:  terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        env:
          TF_VAR_client_id: ${{ secrets.ARM_CLIENT_ID }}
          TF_VAR_client_secret: ${{ secrets.ARM_CLIENT_SECRET }}
          TF_VAR_tenant_id: ${{ secrets.ARM_TENANT_ID }}
          TF_VAR_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: terraform apply -input=false tfplan

  

  ansible:
    needs: terraform
    runs-on: ubuntu-latest   
    defaults:
      run:
        working-directory: ./infrastructure/ansible

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip3 install ansible

      - name: Install latest Ansible
        run: |
          sudo apt-get update -y
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes --update ppa:ansible/ansible
          sudo apt-get install -y ansible

      - name: Configure SSH
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/ansible_key

          chmod 600 ~/.ssh/ansible_key
      - name: create .env
        run: |
          run: |
            cat <<EOF > .env
            PORT=${{ vars.PORT }}
            DIALECT=${{ secrets.DIALECT }}
            DATABASE=${{ secrets.DATABASE }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}
            HOST=${{ secrets.HOST }}
            DB_PORT=${{ secrets.DB_PORT}}
            TOKEN_KEY=${{ secrets.TOKEN_KEY}}
            EOF

      - name: Create Ansible inventory
        env:
          VM_HOST: ${{ secrets.SERVER_HOST }}
          VM_USERNAME: ${{ secrets.SERVER_USER }}
        run: |
          cat > infrastructure/ansible/inventory.ini <<EOF
          [webserver]
          target ansible_host=${VM_HOST} ansible_user=${VM_USERNAME} ansible_ssh_private_key_file=~/.ssh/ansible_key
          EOF

      - name: Test SSH connection
        # working-directory: infrastructure/ansible
        run: |
          for i in {1..30}; do
            if ansible webserver -m ping; then
              echo "Server is ready."
              exit 0
            fi

            echo "Server is not ready yet. Attempt $i/30..."
            sleep 10
          done

          echo "Server did not become ready."
          exit 1

      - name: Run Ansible playbook
        # working-directory: infrastructure/ansible
        run: |
          ansible-playbook playbook.yml

      - name: Remove temporary files
        if: always()
        run: |
          rm -f ~/.ssh/ansible_key
          rm -f infrastructure/ansible/inventory.ini
          rm -f .env
