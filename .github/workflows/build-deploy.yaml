name: deploy resources

env:
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

on:
  workflow_dispatch:
    # inputs:
    #   action:
    #     type: choice
    #     description: 'Select an action to perform'
    #     options:
    #       - apply
    #     required: true

  push:
    branches:
      - main
permissions:
  contents: write

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./infrastructure/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - name: Verify Terraform
        run: terraform version

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Login
        run: |
          az account show --output table

      - name: Verify Azure CLI
        run: |
          az --version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Init
        run: terraform validate

      - name: Terraform Plan
        run:  terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply tfplan

  

  ansible:
    needs: terraform
    runs-on: ubuntu-latest   
    defaults:
      run:
        working-directory: ./infrastructure/ansible

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip3 install ansible

      - name: Install latest Ansible
        run: |
          sudo apt-get update -y
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes --update ppa:ansible/ansible
          sudo apt-get install -y ansible

      - name: Configure SSH
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/ansible_key

          chmod 600 ~/.ssh/ansible_key

      - name: Create Ansible inventory
        env:
          VM_HOST: ${{ secrets.SERVER_HOST }}
          VM_USERNAME: ${{ secrets.SERVER_USER }}
        run: |
          cat > infrastructure/ansible/inventory.ini <<EOF
          [webserver]
          target ansible_host=${VM_HOST} ansible_user=${VM_USERNAME} ansible_ssh_private_key_file=~/.ssh/ansible_key
          EOF

      - name: Test SSH connection
        # working-directory: infrastructure/ansible
        run: |
          for i in {1..30}; do
            if ansible webserver -m ping; then
              echo "Server is ready."
              exit 0
            fi

            echo "Server is not ready yet. Attempt $i/30..."
            sleep 10
          done

          echo "Server did not become ready."
          exit 1

      - name: Run Ansible playbook
        # working-directory: infrastructure/ansible
        run: |
          ansible-playbook playbook.yml

      - name: Remove temporary SSH key
        if: always()
        run: |
          rm -f ~/.ssh/ansible_key
          rm -f infrastructure/ansible/inventory.ini
