name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Actions Run ID to roll back to (e.g., 1234567890)'
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 1: Construct and verify Docker Hub Image Tag existence
      - name: Verify Image Tag Exists on Docker Hub
        id: resolve_tag
        run: |
          RUN_ID="${{ inputs.run_id }}"
          IMAGE_TAG="oluchioraekwe/task-app:v${RUN_ID}"
          DOCKER_REPO="oluchioraekwe/task-app"
          TAG="v${RUN_ID}"

          echo "Verifying image tag $IMAGE_TAG on Docker Hub..."

          # Query Docker Hub v2 API to check if the tag exists
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/${DOCKER_REPO}/tags/${TAG}/")

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Image tag '$IMAGE_TAG' does not exist on Docker Hub (HTTP status $HTTP_STATUS). Please check the Run ID."
            exit 1
          fi

          echo "Verified: Image tag '$IMAGE_TAG' exists on Docker Hub."
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Fetch Server Details from Terraform State
        id: tf_outputs
        working-directory: ./infrastructure/terraform
        run: |
          terraform init
          
          SERVER_HOST=$(terraform output -raw vm-public-ip)
          SERVER_USER=$(terraform output -raw vm-admin-username)

          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ]; then
            echo "::error::Failed to retrieve Terraform outputs from state."
            exit 1
          fi

          echo "server_host=${SERVER_HOST}" >> $GITHUB_OUTPUT
          echo "server_user=${SERVER_USER}" >> $GITHUB_OUTPUT

      # Step 2: Verify yq installation on remote server
      - name: Verify yq Installation on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.tf_outputs.outputs.server_host }}
          username: ${{ steps.tf_outputs.outputs.server_user }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            if ! command -v yq &> /dev/null; then
              echo "::error::yq is not installed or not available in PATH on the server."
              exit 1
            fi
            echo "yq version:"
            yq --version

      # Step 3: Update docker-compose.yaml on the server using yq
      - name: Update docker-compose.yaml on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.tf_outputs.outputs.server_host }}
          username: ${{ steps.tf_outputs.outputs.server_user }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            cd /var/www/repo

            # Update image tag in-place using server-side yq
            yq eval '.services.taskmanager-app.image = "${{ steps.resolve_tag.outputs.image_tag }}"' -i docker-compose.yaml

            # Print updated file for verification
            cat docker-compose.yaml

      # Step 4: Deploy rollback container and verify status
      - name: Deploy Rollback Image on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.tf_outputs.outputs.server_host }}
          username: ${{ steps.tf_outputs.outputs.server_user }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            cd /var/www/repo

            echo "::notice::Rolling back taskmanager-app to image: ${{ steps.resolve_tag.outputs.image_tag }}"

            # Pull target image tag and recreate container
            docker compose pull taskmanager-app
            docker compose up -d taskmanager-app

            # Verify container status
            docker compose ps taskmanager-app

            # Clean up old unused images
            docker image prune -f