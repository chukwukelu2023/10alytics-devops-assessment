name: Deploy Image To Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'task-app/**'

jobs:
  build-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'task-app/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Node.js App
        run: npm run build --if-present

      - name: Run Tests
        run: npm test --if-present

  docker:
    runs-on: ubuntu-latest
    needs: build-node
    outputs:
      image_tag: oluchioraekwe/task-app:v${{ github.run_id }}  
    defaults:
      run:
        working-directory: ./task-app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./task-app
          push: true
          tags: oluchioraekwe/task-app:v${{ github.run_id }}

  # Job 3: Fetch server details and deploy using modular server-side SSH steps
  deploy:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Fetch Server Details from Terraform State
        id: tf_outputs
        working-directory: ./infrastructure/terraform
        run: |
          terraform init
          
          SERVER_HOST=$(terraform output -raw vm-public-ip)
          SERVER_USER=$(terraform output -raw vm-admin-username)

          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ]; then
            echo "::error::Failed to retrieve Terraform outputs from state."
            exit 1
          fi

          echo "server_host=${SERVER_HOST}" >> $GITHUB_OUTPUT
          echo "server_user=${SERVER_USER}" >> $GITHUB_OUTPUT

      # Step 1: Verify yq is installed on the remote server
      - name: Verify yq Installation on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.tf_outputs.outputs.server_host }}
          username: ${{ steps.tf_outputs.outputs.server_user }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            if ! command -v yq &> /dev/null; then
              echo "::error::yq is not installed or not available in PATH on the server."
              exit 1
            fi
            echo "yq version:"
            yq --version

      # Step 2: Update docker-compose.yaml on the server using yq
      - name: Update docker-compose.yaml on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.tf_outputs.outputs.server_host }}
          username: ${{ steps.tf_outputs.outputs.server_user }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            cd /var/www/repo

            # Update image tag in-place using server yq
            yq eval '.services.taskmanager-app.image = "${{ needs.docker.outputs.image_tag }}"' -i docker-compose.yaml

            # Print updated file for verification
            cat docker-compose.yaml

      # Step 3: Deploy updated container and verify status
      - name: Run Updated Docker Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.tf_outputs.outputs.server_host }}
          username: ${{ steps.tf_outputs.outputs.server_user }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            cd /var/www/repo

            # Pull newly updated image tag and recreate only taskmanager-app
            docker compose pull taskmanager-app
            docker compose up -d taskmanager-app

            # Check container status
            docker compose ps taskmanager-app

            # Clean up old unused images
            docker image prune -f