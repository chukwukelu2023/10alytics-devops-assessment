services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    container_name: mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
      MYSQL_DATABASE: "${DATABASE}"
      MYSQL_USER: "${DATABASE_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 25s
      timeout: 20s
      retries: 4
      start_period: 40s
    volumes:
      - db_data:/var/lib/mysql/

  taskmanager-app:
    image: oluchioraekwe/task-app:v.0.2
    container_name: taskmanager
    restart: unless-stopped
    ports:
      - "4500:4500"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:latest
    restart: unless-stopped
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - taskmanager-app

volumes:
  db_data:
  caddy_data:
  caddy_config:
