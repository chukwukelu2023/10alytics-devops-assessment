---
- name: Create application directory
  ansible.builtin.file:
    path: /var/www/repo
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy Docker Compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker-compose.yaml"
    dest: /var/www/repo/docker-compose.yaml
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0664'

- name: Copy environment file (.env)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../.env"
    dest: /var/www/repo/.env
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Copy Caddy configuration file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../Caddyfile"
    dest: /var/www/repo/Caddyfile
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0664'

- name: Start Docker Compose services
  community.docker.docker_compose_v2:
    project_src: /var/www/repo
    state: present
    pull: always