- name: Create application directory
  ansible.builtin.file:
  path: /var/www/repo
  state: directory
  owner: root
  group: root
  mode: '0755'

- name: Copy Docker Compose file
  ansible.builtin.copy:
  src: "{{ playbook_dir }}/../../docker-compose.yaml"
  dest: /var/www/repo/docker-compose.yaml
  owner: root
  group: root
  mode: '0644'

- name: Verify Docker Compose file exists
  ansible.builtin.stat:
  path: /var/www/repo/docker-compose.yaml
  register: compose_file

- name: Fail if Docker Compose file is missing
  ansible.builtin.fail:
  msg: "Docker Compose file was not copied successfully!"
  when: not compose_file.stat.exists
